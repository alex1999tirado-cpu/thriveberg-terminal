[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thriveberg-terminal"
version = "0.5.0"
description = "THRIVEBERG Terminal: Markets. Data. Analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "THRIVEBERG Terminal contributors" }
]
keywords = ["finance", "terminal", "markets", "tui", "textual"]
dependencies = [
  "textual>=0.86",
  "rich>=13.7,<16",
  "numpy>=1.24,<3.0",
  "pandas>=2.0,<3.0",
  "matplotlib>=3.7,<4.0",
  "mplfinance>=0.12.10b0,<0.13",
  "textual-image[textual]==0.12.0",
  "requests>=2.31,<3.0",
  "openpyxl>=3.1,<4.0",
  "websocket-client==1.9.2",
  "defusedxml>=0.7.1,<1.0",
  "cryptography>=50.0,<51.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
build = [
  "pyinstaller>=6.0,<7.0",
]
security = [
  "bandit[toml]>=1.8,<2.0",
  "detect-secrets>=1.5,<2.0",
  "pip-audit>=2.7,<3.0",
]
full = [
  "scipy>=1.10,<2.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
  "python-dotenv>=1.0",
]
charts = [
  "PySide6==6.11.2",
  "pyvista==0.49.0",
  "pyvistaqt==0.12.0",
  "vtk==9.7.1",
  "scipy>=1.18,<2.0",
]

[project.scripts]
ajax = "ajax_terminal.__main__:main"
thriveberg = "ajax_terminal.__main__:main"

[tool.setuptools.packages.find]
include = ["ajax_terminal*"]

[tool.setuptools.package-data]
ajax_terminal = [
  "assets/*.png",
  "assets/*.ico",
  "charts/assets/*.js",
  "charts/assets/*.txt",
  "charts/assets/*.ttf",
  "charts/assets/*.json",
  "games/doom/assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.bandit]
exclude_dirs = ["tests", "ajax_terminal/charts/assets"]
